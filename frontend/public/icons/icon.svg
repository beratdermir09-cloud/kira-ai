<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0810"/>
      <stop offset="100%" style="stop-color:#2a0c10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e11d48"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Border glow -->
  <rect width="512" height="512" rx="96" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>
  <!-- Bot icon -->
  <g transform="translate(256,256)" fill="none" stroke="url(#glow)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <rect x="-100" y="-80" width="200" height="160" rx="30" fill="rgba(225,29,72,0.15)" stroke="url(#glow)" stroke-width="16"/>
    <!-- Eyes -->
    <circle cx="-40" cy="-10" r="22" fill="url(#glow)" stroke="none"/>
    <circle cx="40" cy="-10" r="22" fill="url(#glow)" stroke="none"/>
    <!-- Mouth -->
    <path d="M-50 50 Q0 80 50 50" stroke="url(#glow)" stroke-width="16" fill="none"/>
    <!-- Antenna -->
    <line x1="0" y1="-80" x2="0" y2="-130" stroke="url(#glow)" stroke-width="12"/>
    <circle cx="0" cy="-145" r="18" fill="url(#glow)" stroke="none"/>
    <!-- Ears -->
    <rect x="-130" y="-30" width="30" height="50" rx="10" fill="rgba(225,29,72,0.3)" stroke="url(#glow)" stroke-width="12"/>
    <rect x="100" y="-30" width="30" height="50" rx="10" fill="rgba(225,29,72,0.3)" stroke="url(#glow)" stroke-width="12"/>
  </g>
</svg>
