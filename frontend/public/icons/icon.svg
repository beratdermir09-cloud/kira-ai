<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1040"/>
      <stop offset="100%" style="stop-color:#0c2040"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Border -->
  <rect width="100" height="100" rx="22" fill="none" stroke="url(#spark)" stroke-width="2.5" opacity="0.6"/>
  <!-- Sparkles icon centered -->
  <g filter="url(#glow)" transform="translate(50,50)">
    <!-- Center star -->
    <path d="M0,-22 L3,-3 L22,0 L3,3 L0,22 L-3,3 L-22,0 L-3,-3 Z"
          fill="url(#spark)" opacity="0.95"/>
    <!-- Small top-right star -->
    <path d="M16,-16 L17.5,-11 L22,-10 L17.5,-8.5 L16,-4 L14.5,-8.5 L10,-10 L14.5,-11 Z"
          fill="#67e8f9" opacity="0.8" transform="scale(0.65)"/>
    <!-- Small bottom-left dot -->
    <circle cx="-14" cy="14" r="3.5" fill="#a78bfa" opacity="0.7"/>
  </g>
</svg>
