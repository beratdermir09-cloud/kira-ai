<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1040"/>
      <stop offset="100%" style="stop-color:#0c1a30"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>
  <!-- Border glow -->
  <rect width="100" height="100" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.7"/>
  <!-- K harfi -->
  <text x="50" y="68" 
        font-family="Arial, sans-serif" 
        font-size="58" 
        font-weight="900"
        text-anchor="middle"
        fill="url(#textGrad)">K</text>
  <!-- Küçük sparkle nokta -->
  <circle cx="72" cy="28" r="5" fill="#06b6d4" opacity="0.9"/>
  <circle cx="80" cy="20" r="3" fill="#a78bfa" opacity="0.7"/>
</svg>
